<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rumpus Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400..800&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14121f;
    --bg-raise: #1c1930;
    --surface: #211d3a;
    --surface-hi: #2a2549;
    --line: #352f57;
    --text: #f3f1fb;
    --text-dim: #a89fc9;
    --yellow: #f2c14e;
    --mint: #57e3b0;
    --pink: #ef6f9e;
    --sky: #63b3f2;
    --violet: #a680f2;
    --coral: #f2884e;
    --radius-card: 14px;
    font-size: 16px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(1200px 800px at 15% -10%, #241f42 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Wix Madefor Text', system-ui, -apple-system, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding-left: 64px;
  }
  h1,h2,h3,.wordmark{
    font-family: 'Wix Madefor Display', 'Wix Madefor Text', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  a{ color:inherit; }
  button{ font-family: inherit; cursor:pointer; }
  ::selection{ background: var(--yellow); color:#14121f; }
 
  /* ---------- layout shell ---------- */
  .shell{ max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }
  header.top{
    position: sticky; top:0; z-index: 40;
    background: rgba(20,18,31,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top-inner{
    max-width: 1180px; margin:0 auto; padding: 16px 24px;
    display:flex; align-items:center; gap:20px; flex-wrap: wrap;
  }
  .wordmark{ font-size: 26px; color: var(--text); white-space:nowrap; display:flex; align-items:baseline; gap:8px;}
  .wordmark span{ color: var(--yellow); }
  .tagline{ font-size: 12px; color: var(--text-dim); font-family: inherit; font-weight:400; margin-left:2px; }
 
  .search-wrap{ flex: 1 1 260px; min-width: 180px; position: relative; }
  .search-wrap input{
    width:100%; padding: 10px 14px 10px 36px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font-size: 14px; outline: none;
  }
  .search-wrap input:focus{ border-color: var(--yellow); }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:0.6; }
 
  .auth-area{ display:flex; align-items:center; gap:10px; }
  .btn{
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font-size: 14px; font-weight:600;
    transition: transform .12s ease, border-color .12s ease;
  }
  .btn:hover{ border-color: var(--text-dim); transform: translateY(-1px); }
  .btn.primary{ background: var(--yellow); color:#14121f; border-color: var(--yellow); }
  .btn.primary:hover{ filter: brightness(1.06); }
  .btn.ghost{ background: transparent; }
  .btn:active{ transform: translateY(0); }
 
  .avatar-pill{
    display:flex; align-items:center; gap:8px; padding:6px 14px 6px 6px;
    border-radius: 999px; background: var(--surface); border:1px solid var(--line);
    font-size: 13px; font-weight:600; cursor:pointer; transition: border-color .12s ease;
  }
  .avatar-pill:hover{ border-color: var(--text-dim); }
  .avatar-dot{
    width: 26px; height:26px; border-radius:50%;
    background: linear-gradient(135deg, var(--mint), var(--sky));
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#0d1f1a; font-weight:800;
  }
 
  /* ---------- category pills ---------- */
  .pillbar{ display:flex; gap:8px; overflow-x:auto; padding: 18px 0 6px; }
  .pillbar::-webkit-scrollbar{ display:none; }
  .pill{
    flex: 0 0 auto; padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight:600;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-dim);
    white-space: nowrap;
  }
  .pill.active{ background: var(--text); color: var(--bg); border-color: var(--text); }
 
  /* ---------- hero ---------- */
  .hero{
    margin-top: 22px; border-radius: 22px; border: 1px solid var(--line);
    background: linear-gradient(120deg, #241f42, #1a1730 70%);
    padding: 26px; display:grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items:center;
  }
  @media (max-width: 760px){ .hero{ grid-template-columns: 1fr; } }
  .hero-copy .eyebrow{ color: var(--mint); font-size: 13px; font-weight:700; margin:0 0 8px; }
  .hero-copy h1{ font-size: 34px; line-height:1.15; margin: 0 0 10px; }
  .hero-copy p{ color: var(--text-dim); font-size: 15px; line-height:1.55; max-width: 46ch; margin: 0 0 18px;}
  .hero-stage{
    background: #0e0c1a; border-radius: 16px; border:1px solid var(--line);
    padding: 14px; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #heroCanvas{ image-rendering: pixelated; border-radius: 10px; background:#0a0916; }
  .hero-stage .hs-label{ font-size: 12px; color: var(--text-dim); }
 
  /* ---------- game grid ---------- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin: 34px 0 14px; }
  .section-head h2{ font-size: 20px; margin:0; }
  .section-head .count{ color: var(--text-dim); font-size: 13px; }
 
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; }
  .card{
    position:relative; border-radius: var(--radius-card); border: 1px solid var(--line);
    background: var(--surface); overflow:hidden; display:flex; flex-direction:column;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover{ transform: translateY(-3px); border-color: var(--text-dim); }
  .card .notch{
    position:absolute; top:0; right:18px; width: 26px; height: 12px;
    background: var(--bg); border-bottom-left-radius:8px; border-bottom-right-radius:8px;
  }
  .thumb{
    height: 110px; display:flex; align-items:center; justify-content:center; font-size: 38px;
  }
  .card-body{ padding: 12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-body h3{ font-size: 15px; margin:0; }
  .card-tag{ font-size: 11px; color: var(--text-dim); font-weight:600; }
  .card-foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:8px; }
  .best{ font-size: 12px; color: var(--yellow); font-weight:700; }
  .play-btn{
    font-size: 12px; font-weight:700; padding: 6px 12px; border-radius: 999px;
    background: var(--surface-hi); border:1px solid var(--line); color:var(--text);
  }
  .card:hover .play-btn{ background: var(--yellow); color:#14121f; border-color:var(--yellow); }
  .card.soon{ opacity: 0.55; }
  .card.soon .play-btn{ pointer-events:none; }
 
  .empty{
    text-align:center; padding: 60px 20px; color: var(--text-dim); border:1px dashed var(--line);
    border-radius: 16px;
  }
 
  /* ---------- modal (auth + game) ---------- */
  .overlay{
    position: fixed; inset:0; background: rgba(10,9,18,0.72); backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center; z-index: 100; padding: 20px;
  }
  .hidden{ display:none !important; }
  .modal{
    background: var(--bg-raise); border:1px solid var(--line); border-radius: 18px;
    width: 100%; max-width: 420px; padding: 26px; position:relative;
  }
  .modal.game-modal{ max-width: 640px; }
  .modal .close{
    position:absolute; top:14px; right:14px; background: none; border:none; color: var(--text-dim);
    font-size: 20px; line-height:1; padding:4px;
  }
  .modal .close:hover{ color: var(--text); }
  .modal h2{ margin: 0 0 4px; font-size: 22px; }
  .modal .sub{ color: var(--text-dim); font-size: 13px; margin: 0 0 18px; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight:600; }
  .field input{
    width:100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font-size: 14px; outline:none;
  }
  .field input:focus{ border-color: var(--yellow); }
  .form-msg{ font-size: 13px; min-height: 18px; margin: -4px 0 12px; color: var(--coral); }
  .switch-line{ font-size: 13px; color: var(--text-dim); margin-top: 14px; text-align:center; }
  .switch-line button{ background:none; border:none; color: var(--mint); font-weight:700; padding:0; }
 
  .game-head{ display:flex; align-items:center; justify-content:space-between; gap: 12px; margin-bottom: 14px; padding-right: 26px;}
  .game-head .gh-title{ display:flex; align-items:center; gap:10px; }
  .game-head .gh-title span.icon{ font-size: 24px; }
  .game-head h2{ font-size: 20px; margin:0; }
  .game-stats{ display:flex; gap: 14px; font-size: 13px; color: var(--text-dim); margin-bottom: 10px; flex-wrap:wrap;}
  .game-stats b{ color: var(--text); }
  .game-stage{
    background:#0e0c1a; border-radius: 14px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; padding: 14px; min-height: 300px;
  }
  .game-note{ font-size: 12px; color: var(--text-dim); margin-top: 10px; text-align:center; }
  .game-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .gt-left{ display:flex; gap:8px; }
